<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Print Shop Lab — Week 10 | Digital Design 1</title>
<style>
:root{
  --maroon:#8A0635; --maroon-dk:#5C0423; --ink:#0A0A0A; --silver:#9E9FA3;
  --paper:#FFFFFF; --wash:#F4F1F2; --line:#D9D6D8;
  --ok:#2E7D32; --ok-bg:#E8F3E9; --bad:#B3261E; --bad-bg:#FBE9E7;
  --cyan:#00A0DC; --magenta:#E5007E; --yellow:#FFE500;
  --serif:Cambria, Caladea, Georgia, serif;
  --sans:Calibri, Carlito, "Segoe UI", Arial, sans-serif;
  --mono:"Courier New", Courier, monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--sans);color:var(--ink);background:var(--wash);font-size:17px;line-height:1.45}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}

/* Header: a press sheet with a color bar */
.sheet-head{background:var(--maroon);color:#fff;padding:22px 24px 0}
.head-inner{max-width:1100px;margin:0 auto;display:flex;flex-wrap:wrap;gap:20px 40px;align-items:flex-end;justify-content:space-between}
.head-inner h1{font-family:var(--serif);font-size:2.6rem;line-height:1;margin:0 0 6px}
.head-inner p{margin:0 0 4px;color:#F1D3DD;max-width:46ch}
.who{display:flex;gap:12px;flex-wrap:wrap}
.who label{display:flex;flex-direction:column;font-size:.85rem;color:#F1D3DD}
.who input{margin-top:3px;padding:7px 10px;border:2px solid transparent;border-radius:6px;width:210px;background:#fff;color:var(--ink)}
.who input.short{width:110px}
.who input.need{border-color:var(--yellow)}
.colorbar{max-width:1100px;margin:18px auto 0;display:flex;height:14px}
.colorbar span{flex:1}
.colorbar span:nth-child(1){background:var(--cyan)}
.colorbar span:nth-child(2){background:var(--magenta)}
.colorbar span:nth-child(3){background:var(--yellow)}
.colorbar span:nth-child(4){background:var(--ink)}
.colorbar span:nth-child(5){background:#7FCFEE}
.colorbar span:nth-child(6){background:#F27FBE}
.colorbar span:nth-child(7){background:#FFF27F}
.colorbar span:nth-child(8){background:var(--silver)}

/* Layout */
.wrap{max-width:1100px;margin:0 auto;padding:22px 24px 60px;display:grid;grid-template-columns:240px 1fr;gap:28px}
nav ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;position:sticky;top:12px}
nav button{width:100%;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);display:flex;gap:10px;align-items:center}
nav button .n{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--wash);font-weight:700;color:var(--maroon)}
nav button .t{flex:1;line-height:1.2}
nav button .t small{display:block;color:#666;font-size:.8rem}
nav button[aria-current="step"]{border-color:var(--maroon);box-shadow:inset 0 0 0 1px var(--maroon)}
nav button.done .n{background:var(--ok);color:#fff}
.timer{margin-top:10px;padding:10px 12px;font-size:.9rem;color:#555}

/* Station panel with crop marks */
.station{position:relative;background:var(--paper);padding:30px 34px 34px;border-radius:2px}
.station::before,.station::after{content:"";position:absolute;width:22px;height:22px;pointer-events:none}
.station::before{top:-10px;left:-10px;border-top:1.5px solid var(--ink);border-left:1.5px solid var(--ink)}
.station::after{bottom:-10px;right:-10px;border-bottom:1.5px solid var(--ink);border-right:1.5px solid var(--ink)}
.station h2{font-family:var(--serif);color:var(--maroon);font-size:2rem;margin:0 0 4px;line-height:1.15}
.station .lede{margin:0 0 20px;color:#333;max-width:70ch}
.station h3{font-family:var(--serif);font-size:1.25rem;margin:26px 0 10px}
.time{color:#666;font-size:.9rem;margin:0 0 14px}

.btn{padding:10px 18px;border-radius:8px;border:2px solid var(--maroon);background:var(--maroon);color:#fff;font-weight:700}
.btn.ghost{background:transparent;color:var(--maroon)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row-actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:20px}
.fb{margin-top:10px;padding:10px 14px;border-radius:8px;display:none}
.fb.show{display:block}
.fb.ok{background:var(--ok-bg);color:#1B5E20}
.fb.bad{background:var(--bad-bg);color:#8C1D18}
.fb.info{background:var(--wash);color:#333}
.score-pill{display:inline-block;padding:4px 12px;border-radius:999px;background:var(--wash);font-weight:700}

/* Station 1 */
.s1{display:grid;grid-template-columns:minmax(260px,420px) 1fr;gap:28px;align-items:start}
.s1 svg{width:100%;height:auto}
.field{display:flex;flex-direction:column;margin-bottom:14px}
.field span{font-weight:700;margin-bottom:4px}
.field select,.field input{padding:8px 10px;border:1px solid #bbb;border-radius:6px;max-width:260px}
.field.ok select,.field.ok input{border-color:var(--ok);background:var(--ok-bg)}
.field.bad select,.field.bad input{border-color:var(--bad);background:var(--bad-bg)}
.dims{display:flex;gap:8px;align-items:center}
.dims input{width:80px}

/* Station 2 */
.s2{display:grid;grid-template-columns:1.4fr 1fr;gap:24px;align-items:start}
.cardwrap{background:#2b2b2b;padding:18px;border-radius:6px}
.cardwrap svg{width:100%;height:auto;display:block}
.hit{cursor:pointer}
.hit:hover .hl{stroke:var(--yellow);stroke-width:3}
.panel{border:1px solid #bbb;border-radius:4px;background:#ECECEC;margin-bottom:16px;font-size:.92rem}
.panel h4{margin:0;padding:6px 10px;background:#D6D6D6;font-size:.85rem;font-family:var(--sans)}
.panel button{display:flex;justify-content:space-between;width:100%;padding:8px 10px;border:0;border-top:1px solid #d0d0d0;background:transparent;text-align:left}
.panel button:hover{background:#fff}
.panel button.found{background:var(--ok-bg);color:#1B5E20;font-weight:700}
.panel button.miss{background:#f6f6f6;color:#777}
.found-list{margin:0;padding-left:20px}
.found-list li{margin-bottom:6px}
.counter{font-family:var(--serif);font-size:1.5rem;color:var(--maroon)}

/* Station 3 */
.codes{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px;padding:0;list-style:none}
.codes li{background:var(--wash);border-radius:6px;padding:4px 10px;font-size:.9rem}
.codes code{font-family:var(--mono);font-weight:700}
.rename{border-top:1px solid var(--line);padding:14px 0}
.rename .old{font-family:var(--mono);font-size:1rem;background:var(--wash);padding:2px 8px;border-radius:4px}
.rename .clue{color:#444;margin:6px 0 8px}
.rename .go{display:flex;gap:8px;flex-wrap:wrap}
.rename input{flex:1;min-width:240px;padding:8px 10px;border:1px solid #bbb;border-radius:6px;font-family:var(--mono)}
.rename.ok input{border-color:var(--ok);background:var(--ok-bg)}
.rename .fb{margin-top:8px}

/* Station 4 */
.sort-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.sort-row .fname{font-family:var(--mono);font-size:.95rem;word-break:break-all}
.seg{display:flex;border:1px solid #bbb;border-radius:8px;overflow:hidden}
.seg button{border:0;background:#fff;padding:7px 12px;font-size:.9rem;border-right:1px solid #ddd}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--maroon);color:#fff}
.sort-row.ok .seg{border-color:var(--ok);box-shadow:0 0 0 2px var(--ok-bg)}
.sort-row.bad .seg{border-color:var(--bad);box-shadow:0 0 0 2px var(--bad-bg)}
.mc label{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;cursor:pointer}
.mc label:hover{background:var(--wash)}
.mc label.ok{border-color:var(--ok);background:var(--ok-bg)}
.mc label.bad{border-color:var(--bad);background:var(--bad-bg)}

/* Station 5 */
.order{list-style:none;padding:0;margin:0;counter-reset:step}
.order li{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;background:#fff;counter-increment:step}
.order li::before{content:counter(step);flex:none;width:30px;height:30px;border-radius:50%;background:var(--wash);color:var(--maroon);font-weight:700;display:grid;place-items:center}
.order li span{flex:1}
.order li.ok{border-color:var(--ok);background:var(--ok-bg)}
.order li.bad{border-color:var(--bad);background:var(--bad-bg)}
.order .mv{border:1px solid #bbb;background:#fff;border-radius:6px;width:36px;height:32px}

/* Station 6 */
.email{border:1px solid var(--line);border-radius:8px;margin-bottom:18px;overflow:hidden}
.email .meta{background:var(--wash);padding:8px 14px;font-size:.88rem;color:#444;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.email .body{padding:12px 14px}
.email .body p{margin:0 0 10px;font-family:var(--serif);font-size:1.05rem}

/* Report */
.report table{border-collapse:collapse;width:100%;margin:10px 0 18px}
.report th,.report td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}
.report td.num{text-align:right;font-variant-numeric:tabular-nums}
.report tfoot td{font-weight:700;font-size:1.1rem;border-top:2px solid var(--ink)}
.report textarea{width:100%;min-height:110px;padding:10px;border:1px solid #bbb;border-radius:8px}
.stamp{display:inline-block;border:3px solid var(--maroon);color:var(--maroon);font-family:var(--serif);font-weight:700;padding:6px 14px;transform:rotate(-3deg);font-size:1.2rem}
.note{color:#555;font-size:.92rem}

@media (max-width:860px){
  .wrap{grid-template-columns:1fr}
  nav ol{position:static;flex-direction:row;overflow-x:auto}
  nav button{min-width:170px}
  .s1,.s2{grid-template-columns:1fr}
  .station{padding:24px 18px}
}
@media print{
  .sheet-head .who input{border:0}
  nav,.row-actions,.no-print{display:none!important}
  .wrap{display:block}
  body{background:#fff}
}
@media (prefers-reduced-motion:no-preference){
  .fb.show{animation:pop .2s ease-out}
  @keyframes pop{from{transform:translateY(-3px);opacity:.4}to{transform:none;opacity:1}}
}
</style>
</head>
<body>

<header class="sheet-head">
  <div class="head-inner">
    <div>
      <h1>Print Shop Lab</h1>
      <p>Week 10 review: preflight and file naming. Work through all six stations, then turn in your lab report.</p>
    </div>
    <div class="who">
      <label>Your name<input id="sname" autocomplete="name" placeholder="First and last name"></label>
      <label>Class period<input id="speriod" class="short" placeholder="e.g. 3"></label>
    </div>
  </div>
  <div class="colorbar" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
</header>

<div class="wrap">
  <nav aria-label="Stations"><ol id="nav"></ol><div class="timer" id="timer"></div></nav>
  <main id="stage" class="station" tabindex="-1"></main>
</div>

<script>
(function(){
"use strict";
/* ===== TEACHER SETUP: paste your Apps Script web app URL between the quotes ===== */
var RESULTS_URL="PASTE_WEB_APP_URL_HERE";
/* ================================================================================ */
var KEY="dd1-print-shop-lab-w10";
var S={name:"",period:"",cur:0,start:Date.now(),s1:{},s2:{found:[],miss:0},s3:{},s4:{},s5:{},s6:{},reflection:""};
try{var saved=JSON.parse(localStorage.getItem(KEY)||"null"); if(saved) S=Object.assign(S,saved);}catch(e){}
if(!S.sid){S.sid=Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
var HAS_URL=/^https:\/\/script\.google\.com\//.test(RESULTS_URL);

var $=function(sel,root){return (root||document).querySelector(sel);};
var $$=function(sel,root){return Array.prototype.slice.call((root||document).querySelectorAll(sel));};
function esc(t){return String(t).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

/* ---------------- Station data ---------------- */
var STATIONS=[
 {id:"s1",title:"Label the lines",mins:6},
 {id:"s2",title:"Preflight detective",mins:10},
 {id:"s3",title:"Rename the files",mins:10},
 {id:"s4",title:"Sort the files",mins:7},
 {id:"s5",title:"Print-ready order",mins:5},
 {id:"s6",title:"Printer's inbox",mins:8},
 {id:"report",title:"Lab report",mins:2}
];

/* Station 1 */
var S1_Q=[
 {k:"red",label:"Red line",ans:"bleed"},
 {k:"black",label:"Solid black line",ans:"trim"},
 {k:"blue",label:"Dashed blue line",ans:"safe"}
];
/* Station 2 */
var S2_ERR={
 bg:"The background stops at the trim line on the right side. It must stretch all the way to the red bleed line, or a white sliver can show after cutting.",
 lowres:"The logo is a low-resolution image, so it prints blocky. Print images need about 300 ppi, or use vector art.",
 spell:"\u201cDesinger\u201d is misspelled. It should be \u201cDesigner.\u201d Always read every word out loud before printing.",
 font:"The pink highlight means a missing font. The printer would swap in a default font. Activate the font or choose another one, then outline type on the print copy.",
 safe:"The phone number sits outside the safe zone, right against the trim. It could be cut off. Move it inside the dashed line.",
 bleed0:"Bleed is set to 0 in. It should be 0.125 in on every side.",
 rgb:"The document is in RGB color mode. Print jobs should be CMYK.",
 missing:"maya_headshot.jpg has a missing link. The printer will get a low-quality preview or nothing at all. Relink or embed the image."
};
var S2_FINE={
 name:"The name is inside the safe zone and spelled right. That one\u2019s fine.",
 web:"The website is inside the safe zone. That one\u2019s fine.",
 rule:"The divider line is fine.",
 size:"3.5 \u00d7 2 in is the correct business card size.",
 units:"Inches are the right units for a print piece.",
 logo2:"cowboys_logo.png is embedded. That one\u2019s fine.",
 bgleft:"On this side the background reaches the bleed line. That\u2019s correct."
};
/* Station 3 */
var CODES=[["Postcard","Water Bottle Postcard"],["GameDayTicket","Game Day Ticket"],["BusinessCard","Business Card"],["ShapeComp","Shape Composition"],["Rationale","Design Rationale"],["Q1Reflection","Q1 Reflection"]];
var S3_Q=[
 {old:"untitled-1.ai",clue:"Her water bottle postcard. First version, editable Illustrator file.",ans:["Mitchell_A_Postcard_v1.ai"]},
 {old:"ava ticket NEW.pdf",clue:"Her Game Day Ticket print PDF. Version 2.",ans:["Mitchell_A_GameDayTicket_v2.pdf"]},
 {old:"businesscard FINAL!!.ai",clue:"Her editable business card file. Version 4.",ans:["Mitchell_A_BusinessCard_v4.ai"]},
 {old:"Untitled-3.png",clue:"A preview image of her Game Day Ticket, version 3, for Google Classroom.",ans:["Mitchell_A_GameDayTicket_v3_preview.png"]},
 {old:"card copy.ai",clue:"The outlined print copy of her business card, version 4.",ans:["Mitchell_A_BusinessCard_v4_print.ai"]},
 {old:"shapes thing (2).ai",clue:"Her shape composition. Version 2, editable.",ans:["Mitchell_A_ShapeComp_v2.ai"]},
 {old:"my reflection q1.docx",clue:"Her Quarter 1 reflection (Word file). Version 1.",ans:["Mitchell_A_Q1Reflection_v1.docx","Mitchell_A_Q1Reflection.docx"]},
 {old:"why I did it.docx",clue:"Her design rationale for the ticket (Word file). Version 1.",ans:["Mitchell_A_Rationale_v1.docx","Mitchell_A_Rationale.docx"]}
];
/* Station 4 */
var BINS=[["edit","Edit it"],["printer","Send to printer"],["online","Post online"]];
var S4_FILES=[
 ["Mitchell_A_Postcard_v3.ai","edit"],["Mitchell_A_Postcard_v3.pdf","printer"],["Mitchell_A_Postcard_v3_preview.png","online"],
 ["Mitchell_A_GameDayTicket_v2.ai","edit"],["Mitchell_A_GameDayTicket_v2.pdf","printer"],["Mitchell_A_GameDayTicket_v2_preview.png","online"],
 ["Mitchell_A_BusinessCard_v4.pdf","printer"],["Mitchell_A_BusinessCard_v4.ai","edit"],["Mitchell_A_Poster_v1.psd","edit"]
];
var S4_MC={q:"Your Google Drive lists these files in A\u2013Z order. Which one is the newest?",
 opts:["Mitchell_A_GameDayTicket_v1.ai","Mitchell_A_GameDayTicket_v10.ai","Mitchell_A_GameDayTicket_v2.ai","Mitchell_A_GameDayTicket_v9.ai"],ans:1,
 why:"v10 is the newest, even though A\u2013Z sorting puts it second. Computers sort text one character at a time, so \u201c1\u201d in 10 comes before \u201c2.\u201d That\u2019s why many studios write versions as v01, v02 \u2026 v10."};
/* Station 5 */
var S5_STEPS=["Run the preflight checklist and fix every problem","Save the editable file (.ai) with the class naming formula","Save As a second copy with _print at the end","In the _print copy: Select All, then Type > Create Outlines","Save As Adobe PDF with [Press Quality] and Use Document Bleed Settings","Export a PNG preview at 150 ppi","Upload the .ai, PDF, and PNG to Google Classroom"];
/* Station 6 */
var S6_Q=[
 {from:"Cowboy Print Shop",sub:"White edge on your cards",body:"We trimmed your business cards and a thin white line shows along the right edge of every card.",opts:["Make the text bigger","Stretch the background out to the bleed line","Change the file to RGB","Rename the file"],ans:1,why:"Paper shifts a tiny bit when it\u2019s cut. Art that reaches the bleed line covers that shift."},
 {from:"Cowboy Print Shop",sub:"Font problem",body:"Your ticket printed in Courier instead of the font you picked. Our computer doesn\u2019t have your font.",opts:["Convert type to outlines on the print copy before making the PDF","Export a PNG instead","Make the font bold","Add more bleed"],ans:0,why:"Create Outlines turns letters into shapes, so the printer doesn\u2019t need your font."},
 {from:"Cowboy Print Shop",sub:"Blurry logo",body:"The logo on your postcard looks blocky and pixelated in print.",opts:["Zoom in before exporting","Use a higher-resolution image (about 300 ppi) or vector art","Switch to RGB","Move it into the safe zone"],ans:1,why:"Low-resolution images look fine on screen but break up in print. Use 300 ppi or vector art."},
 {from:"Cowboy Print Shop",sub:"Colors look dull",body:"Your file came in using RGB colors, so the bright maroon printed duller than you expected.",opts:["Set Document Color Mode to CMYK and recheck the colors","Turn the brightness up","Export as PNG","Add a drop shadow"],ans:0,why:"Printers use CMYK ink. Design in CMYK from the start so what you see is closer to what prints."},
 {from:"Cowboy Print Shop",sub:"Phone number cut off",body:"The last digit of your phone number was trimmed off the edge of the card.",opts:["Add more bleed","Make the card bigger","Move the text inside the safe zone","Outline the text"],ans:2,why:"Keep all text and logos inside the safe zone, 0.125 in in from the trim."},
 {from:"Cowboy Print Shop",sub:"Which file?",body:"We received final.pdf, final2.pdf, and final_FINAL.pdf. Which one do you want printed?",opts:["Send all three again","Rename with the class formula and a version number, then send only the newest","Delete the oldest one","Call it final_final_v2.pdf"],ans:1,why:"Version numbers make the newest file obvious. \u201cFinal\u201d tells nobody anything."},
 {from:"Cowboy Print Shop",sub:"No bleed in your PDF",body:"Your PDF is exactly 3.5 \u00d7 2 in with no extra area around the edge.",opts:["Set bleed to 0.125 in, then check Use Document Bleed Settings under Marks and Bleeds when saving the PDF","Export as PNG","Scale the art down","Rename the file"],ans:0,why:"The bleed has to be set in the document AND turned on when you save the PDF."}
];

/* ---------------- Scoring ---------------- */
function score(id){
  if(id==="s1"){var st=S.s1;return {got:st.first||0,of:5,done:!!st.done};}
  if(id==="s2"){return {got:S.s2.found.length,of:8,done:S.s2.found.length===8,extra:S.s2.miss};}
  if(id==="s3"){var g=0,d=0;S3_Q.forEach(function(q,i){var r=S.s3[i];if(r&&r.ok){d++;if(r.tries===1)g++;}});return {got:g,of:S3_Q.length,done:d===S3_Q.length};}
  if(id==="s4"){var st4=S.s4;return {got:st4.first||0,of:S4_FILES.length+1,done:!!st4.done};}
  if(id==="s5"){var st5=S.s5;return {got:st5.first||0,of:S5_STEPS.length,done:!!st5.done};}
  if(id==="s6"){var g6=0,d6=0;S6_Q.forEach(function(q,i){var r=S.s6[i];if(r&&r.ok){d6++;if(r.tries===1)g6++;}});return {got:g6,of:S6_Q.length,done:d6===S6_Q.length};}
  return {got:0,of:0,done:false};
}

/* ---------------- Send results to teacher ---------------- */
var ERR_SHORT={bg:"Background short of bleed",lowres:"Low-res logo",spell:"Misspelling",font:"Missing font",safe:"Text outside safe zone",bleed0:"Bleed set to 0",rgb:"RGB color mode",missing:"Missing link"};
function payload(status){
  var sc={};["s1","s2","s3","s4","s5","s6"].forEach(function(id){sc[id]=score(id);});
  var total=0,of=0;Object.keys(sc).forEach(function(k){total+=sc[k].got;of+=sc[k].of;});
  var finished=Object.keys(sc).filter(function(k){return sc[k].done;}).length;
  return {
    sid:S.sid,name:S.name,period:S.period,status:status,
    minutes:Math.floor((Date.now()-S.start)/60000),
    stationsDone:finished,
    s1:sc.s1.got,s2:sc.s2.got,s3:sc.s3.got,s4:sc.s4.got,s5:sc.s5.got,s6:sc.s6.got,
    total:total,outOf:of,
    s2FalseAlarms:S.s2.miss||0,
    s2NotFound:Object.keys(ERR_SHORT).filter(function(k){return S.s2.found.indexOf(k)<0;}).map(function(k){return ERR_SHORT[k];}).join("; "),
    s3Missed:S3_Q.map(function(q,i){var r=S.s3[i];if(!r||!r.ok)return q.old+(r&&r.tries?" (not solved, "+r.tries+" tries)":" (not tried)");if(r.tries>1)return q.old+" ("+r.tries+" tries)";return null;}).filter(Boolean).join("; "),
    s6Missed:S6_Q.map(function(q,i){var r=S.s6[i];if(!r||!r.ok)return q.sub+" (not solved)";if(r.tries>1)return q.sub+" ("+r.tries+" tries)";return null;}).filter(Boolean).join("; "),
    reflection:S.reflection||""
  };
}
function send(status,cb){
  if(!HAS_URL||!S.name){if(cb)cb(false);return;}
  try{

/* ---------------- Station 3 ---------------- */
function hint3(v,q){
  var exp=q.ans[0];
  if(!v)return "Type a new name first.";
  if(/\s/.test(v))return "Remove the spaces. Use underscores _ between parts.";
  if(/[\/\\:*?"<>|#%&!'(),]/.test(v))return "Remove special characters. Use only letters, numbers, and underscores.";
  if(/final/i.test(v))return "Never use \u201cfinal.\u201d Use a version number like _v4.";
  var ext=exp.slice(exp.lastIndexOf("."));
  if(v.slice(-ext.length).toLowerCase()!==ext)return "Check the extension. This kind of file ends in "+ext;
  if(!/^mitchell_a_/i.test(v))return "Start with LastName_FirstInitial_ \u2014 for Ava Mitchell that\u2019s Mitchell_A_";
  var lower=q.ans.map(function(a){return a.toLowerCase();});
  if(lower.indexOf(v.toLowerCase())>-1)return "So close. Check capitalization: Capitalize Each Word in the name and project code, lowercase v.";
  var code=exp.split("_")[2];
  if(v.split("_")[2]!==code)return "Check the project code. Use the code list above.";
  var vm=v.match(/_v(\d+)/i),em=exp.match(/_v(\d+)/);
  if(em&&!vm)return "Add the version number, like _v"+em[1]+".";
  if(em&&vm&&vm[1]!==em[1])return "Re-read the clue. Which version is it?";
  if(/preview|print/.test(exp)&&!/_(preview|print)\./.test(v))return "This is a special copy. Add a tag before the extension: _print or _preview.";
  return "Compare with the formula LastName_FirstInitial_ProjectCode_v#.ext and re-read the clue.";
}

  var allDone=rows.every(function(r){return r.done;});
  var now=new Date();
  stage.innerHTML='<h2>Lab report</h2><p class="lede">Scores count answers that were right on the first check. Finish any station marked \u201cnot finished,\u201d answer the reflection, then turn this in.</p>'+
  '<p><b>Name:</b> '+(S.name?esc(S.name):'<span style="color:var(--bad)">Type your name at the top of the page</span>')+' &nbsp; <b>Period:</b> '+esc(S.period||"\u2014")+'</p>'+
  '<div class="report"><table><thead><tr><th>Station</th><th>Status</th><th class="num">Score</th></tr></thead><tbody>'+
  rows.map(function(r){return '<tr><td>'+esc(r.t)+(r.extra?'<br><span class="note">'+r.extra+' false alarm'+(r.extra===1?"":"s")+'</span>':'')+'</td><td>'+(r.done?"\u2713 Finished":"Not finished")+'</td><td class="num">'+r.got+' / '+r.of+'</td></tr>';}).join("")+
  '</tbody><tfoot><tr><td>Total</td><td>'+(allDone?"All stations finished":"")+'</td><td class="num">'+got+' / '+of+'</td></tr></tfoot></table>'+
  '<h3>Reflection</h3><p>Which preflight mistake do you think is the easiest to make? What will you do to avoid it on your next project?</p>'+
  '<textarea id="refl" aria-label="Reflection">'+esc(S.reflection||"")+'</textarea>'+
  '<p class="note">Report created '+now.toLocaleDateString()+' at '+now.toLocaleTimeString([], {hour:"numeric",minute:"2-digit"})+' after '+Math.floor((Date.now()-S.start)/60000)+' minutes in the lab.</p>'+
  (allDone&&S.name?'<p><span class="stamp">Approved for print</span></p>':'')+
  '</div><h3 class="no-print">How to turn it in</h3>'+
  (HAS_URL?'<p class="no-print">Click <b>Submit to teacher</b> when you\u2019re done. Your teacher also asked you to screenshot this report (on a Chromebook press <b>Ctrl + Show windows</b>) and attach it in Google Classroom.</p>'
          :'<p class="no-print">Take a screenshot of this whole report (on a Chromebook press <b>Ctrl + Show windows</b>) and attach it to the assignment in Google Classroom. Or use <b>Save as PDF</b> and attach the PDF.</p>')+
  '<div class="row-actions">'+(HAS_URL?'<button class="btn" id="submit">Submit to teacher</button>':'')+'<button class="btn'+(HAS_URL?' ghost':'')+'" id="pdf">Save as PDF</button><button class="btn ghost" id="reset">Start over</button></div><div class="fb" id="subfb"></div>';
  if(HAS_URL){
    var sb=$("#submit",stage),sf=$("#subfb",stage);
    if(S.submittedAt)fb(sf,"ok","Submitted at "+S.submittedAt+". You can submit again if you change anything.");
    sb.onclick=function(){
      if(!S.name){fb(sf,"bad","Type your name at the top of the page, then submit.");nm.focus();return;}
      if(!S.reflection.trim()){fb(sf,"bad","Answer the reflection question before you submit.");$("#refl",stage).focus();return;}
      sb.disabled=true;fb(sf,"info","Sending\u2026");
      send("Submitted",function(ok){
        sb.disabled=false;
        if(ok){S.submittedAt=new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit"});save();fb(sf,"ok","Submitted at "+S.submittedAt+". Your teacher can see your results.");}
        else fb(sf,"bad","Couldn\u2019t reach the results sheet. Check your internet, try again, or turn in a screenshot instead.");
      });
    };
  }
  $("#refl",stage).addEventListener("input",function(e){S.reflection=e.target.value;save();});
  $("#pdf",stage).onclick=function(){window.print();};
  $("#reset",stage).onclick=function(){if(confirm("Erase all your answers and start the lab over?")){try{localStorage.setItem(KEY,JSON.stringify({sid:S.sid,name:S.name,period:S.period}));}catch(e){}location.reload();}};
}

/* ---------------- Render ---------------- */
var R=[r1,r2,r3,r4,r5,r6,r7];
function render(){renderNav();var stage=$("#stage");R[S.cur](stage);}

var nm=$("#sname"),pd=$("#speriod");
nm.value=S.name;pd.value=S.period;
function needName(){nm.classList.toggle("need",!nm.value.trim());}
nm.addEventListener("input",function(){S.name=nm.value.trim();save();needName();});
pd.addEventListener("input",function(){S.period=pd.value.trim();save();});
needName();
setInterval(function(){var m=Math.floor((Date.now()-S.start)/60000);$("#timer").textContent="Time in lab: "+m+" min";},30000);
render();
})();
</script>
